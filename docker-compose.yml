services:
  mongo:
    image: mongo:7
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - 'mongodb://127.0.0.1:27017/admin?directConnection=true'
        - --eval
        - |
          try {
            rs.status();
          } catch (error) {
            if (error.code !== 94) throw error;
            rs.initiate({
              _id: 'rs0',
              members: [{ _id: 0, host: 'mongo:27017' }],
            });
          }
          const hello = db.hello();
          quit(hello.setName === 'rs0' && hello.isWritablePrimary ? 0 : 1);
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  mongo-data:
